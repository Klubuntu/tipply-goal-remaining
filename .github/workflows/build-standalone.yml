name: Build Standalone

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS x64 + arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install
        working-directory: app
      - run: pnpm run build:macos
        working-directory: app
      - run: pnpm run build:macos-arm64
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: tipply-gr-macos
          path: app/dist/tipply-gr-macos-*

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install
        working-directory: app
      - run: pnpm run build:linux
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: tipply-gr-linux
          path: app/dist/tipply-gr-linux-*

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install
        working-directory: app
      - run: pnpm run build:windows
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: tipply-gr-windows
          path: app/dist/tipply-gr-win-*

  create-tag:
    name: Create Release Tag
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create and push tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi
