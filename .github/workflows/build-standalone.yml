name: Build Standalone

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS x64 + arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install
        working-directory: app
      - run: pnpm run build:macos
        working-directory: app
      - run: pnpm run build:macos-arm64
        working-directory: app
      - name: Package macOS artifacts (portable folder)
        run: |
          mkdir -p release
          for f in app/dist/tipply-gr-macos-*; do
            if [ -d "$f" ]; then
              name=$(basename "$f")
              (cd app/dist && zip -r "../../release/${name}.zip" "$name" >/dev/null)
            fi
          done
          ls -la release/
      - uses: actions/upload-artifact@v4
        with:
          name: tipply-gr-macos
          path: release/*.zip

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install
        working-directory: app
      - run: pnpm run build:linux
        working-directory: app
      - name: Package Linux artifacts (portable folder)
        run: |
          mkdir -p release
          for f in app/dist/tipply-gr-linux-*; do
            if [ -d "$f" ]; then
              name=$(basename "$f")
              (cd app/dist && zip -r "../../release/${name}.zip" "$name" >/dev/null)
            fi
          done
          ls -la release/
      - uses: actions/upload-artifact@v4
        with:
          name: tipply-gr-linux
          path: release/*.zip

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install
        working-directory: app
      - run: pnpm run build:windows
        working-directory: app
      - name: Package Windows artifacts (portable folder)
        shell: pwsh
        run: |
          $releaseDir = Join-Path (Get-Location) 'release'
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $appDistDir = Join-Path (Get-Location) 'app' 'dist'
          Write-Host "App dist directory: $appDistDir"
          $items = Get-ChildItem -Path $appDistDir -Filter 'tipply-gr-win-*' -Directory
          Write-Host "Found directories: $($items | ForEach-Object { $_.Name })"
          foreach ($item in $items) {
            $name = $item.Name
            $zipPath = Join-Path $releaseDir "$name.zip"
            Write-Host "Creating zip: $zipPath"
            Compress-Archive -Path $item.FullName -DestinationPath $zipPath -Force
            Write-Host "Created zip with size: $(Get-Item $zipPath).Length bytes"
          }
          Write-Host 'Final release directory contents:'
          Get-ChildItem -Path $releaseDir -Recurse | ForEach-Object { Write-Host $_.FullName }
      - uses: actions/upload-artifact@v4
        with:
          name: tipply-gr-windows
          path: release/*.zip

  create-tag:
    name: Create Tag and Release
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version tag
        id: set_tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "TAG=v${VERSION}" >> $GITHUB_ENV
          if ! git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          files: |
            artifacts/tipply-gr-macos/*.zip
            artifacts/tipply-gr-linux/*.zip
            artifacts/tipply-gr-windows/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release body
        run: |
          VERSION=${TAG#v}
          CHANGELOG=""
          
          if [ -f "changelog.txt" ]; then
            CHANGELOG=$(awk -v ver="$VERSION" '
              /^## \[/{
                if(found) exit
                if($0 ~ "\\[" ver "\\]") {
                  found=1
                  next
                }
              }
              found
            ' changelog.txt)
          fi
          
          NOTES=$(printf "Release %s\n\nBuild & Setup links:\n\nBuild: https://github.com/%s/blob/main/README.md#build\nSetup: https://github.com/%s/blob/main/README.md#setup\nThemes: https://github.com/%s/blob/main/README.md#themes\n\n## Changelog\n\n%s" "${TAG}" "${GITHUB_REPOSITORY}" "${GITHUB_REPOSITORY}" "${GITHUB_REPOSITORY}" "${CHANGELOG}")
          gh release edit "${TAG}" -n "$NOTES"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.TAG }}
