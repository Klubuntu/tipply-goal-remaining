name: Build Standalone

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS x64 + arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install
        working-directory: app
      - run: pnpm run build:macos
        working-directory: app
      - run: pnpm run build:macos-arm64
        working-directory: app
      - name: Package macOS artifacts
        run: |
          mkdir -p release
          for f in app/dist/tipply-gr-macos-*; do
            base=$(basename "$f")
            mkdir -p "release/${base}"
            cp "$f" "release/${base}/"
            cp config.json "release/${base}/" || true
            cp -r public/css "release/${base}/css" || true
            cp -r public/fonts "release/${base}/fonts" || true
            (cd release && zip -r "${base}.zip" "${base}")
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tipply-gr-macos
          path: release/*.zip

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install
        working-directory: app
      - run: pnpm run build:linux
        working-directory: app
      - name: Package Linux artifacts
        run: |
          mkdir -p release
          for f in app/dist/tipply-gr-linux-*; do
            base=$(basename "$f")
            mkdir -p "release/${base}"
            cp "$f" "release/${base}/"
            cp config.json "release/${base}/" || true
            cp -r public/css "release/${base}/css" || true
            cp -r public/fonts "release/${base}/fonts" || true
            (cd release && zip -r "${base}.zip" "${base}")
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tipply-gr-linux
          path: release/*.zip

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install
        working-directory: app
      - run: pnpm run build:windows
        working-directory: app
      - name: Package Windows artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Get-ChildItem -Path app/dist -Filter 'tipply-gr-win-*' | ForEach-Object {
            $f = $_.FullName
            $base = $_.Name
            $dest = Join-Path 'release' $base
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Copy-Item -Path $f -Destination $dest
            if (Test-Path config.json) { Copy-Item -Path config.json -Destination $dest -Force }
            if (Test-Path public\css) { Copy-Item -Path public\css -Destination (Join-Path $dest 'css') -Recurse -Force }
            if (Test-Path public\fonts) { Copy-Item -Path public\fonts -Destination (Join-Path $dest 'fonts') -Recurse -Force }
            $zip = Join-Path 'release' ($base + '.zip')
            if (Test-Path $zip) { Remove-Item $zip }
            Compress-Archive -Path $dest -DestinationPath $zip
          }
      - uses: actions/upload-artifact@v4
        with:
          name: tipply-gr-windows
          path: release/*.zip

  create-tag:
    name: Create Tag and Release
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version tag
        id: set_tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "TAG=v${VERSION}" >> $GITHUB_ENV
          if ! git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          files: |
            artifacts/**
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release body
        run: |
          gh release edit "${TAG}" --add-note "Release ${TAG}\n\nBuild & Setup links:\n- Build: https://github.com/${{ github.repository }}/blob/main/README.md#build\n- Setup: https://github.com/${{ github.repository }}/blob/main/README.md#setup\n- Themes: https://github.com/${{ github.repository }}/blob/main/README.md#themes"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.TAG }}
